name: zombiejox
description: Open-source Flutter replacement for the discontinued JaxJox Connect app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

# Re-run after editing:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon-1024.png"
  # Android adaptive icons: cream background + transparent foreground so
  # the design sits inside any launcher mask (circle / squircle / rounded
  # square) without getting cropped.
  adaptive_icon_background: "#F4ECD4"
  adaptive_icon_foreground: "assets/icon-foreground-1024.png"

flutter_native_splash:
  color: "#F4ECD4"
  image: "assets/icon-1024.png"
  android_12:
    color: "#F4ECD4"
    image: "assets/icon-foreground-1024.png"
