name: zombiejox
description: Open-source Flutter replacement for the discontinued JaxJox Connect app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  # Bundled assets the app reads at runtime. `flutter_launcher_icons` /
  # `flutter_native_splash` consume `assets/*` directly from disk during
  # their generators, so they don't need an entry here — but the About
  # screen does (Image.asset reads the Flutter asset bundle).
  assets:
    - assets/icon-1024.png

# Re-run after editing:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon-1024.png"
  # Android adaptive icons: cream background + transparent foreground so
  # the design sits inside any launcher mask (circle / squircle / rounded
  # square) without getting cropped.
  adaptive_icon_background: "#F4ECD4"
  adaptive_icon_foreground: "assets/icon-foreground-1024.png"

flutter_native_splash:
  color: "#F4ECD4"
  image: "assets/icon-1024.png"
  # Android 12+ applies a fixed circular mask to the splash icon, so the
  # source PNG needs transparent padding around the design (otherwise the
  # corners — and the dumbbell sticking out to the right — get clipped).
  # `icon-splash-1024.png` is the foreground design rendered at 66.7% of
  # its canvas; the surrounding transparency absorbs the mask.
  android_12:
    color: "#F4ECD4"
    image: "assets/icon-splash-1024.png"
